<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>🕹 МАРКАДА — игры Марка</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:#070b16;color:#eef3ff;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;overflow-x:hidden}
  /* 🕹 2D-ЗАЛ: тёмные стены, неоновое зарево и ковровый пол в перспективе (просьба Марка) */
  body{background:
    radial-gradient(760px 420px at 50% -6%, #a855f766, transparent 62%),
    radial-gradient(680px 380px at 8% 16%, #0ea5e955, transparent 60%),
    radial-gradient(680px 380px at 92% 16%, #ff5fa255, transparent 60%),
    linear-gradient(180deg, #120a28 0%, #0b0a1c 46%, #1a1030 47%, #0a0716 100%);}
  body::before{content:'';position:fixed;left:0;right:0;bottom:0;height:54%;z-index:0;pointer-events:none;
    background:
      repeating-linear-gradient(90deg, #ffffff0c 0 2px, transparent 2px 52px),
      repeating-linear-gradient(0deg, #ffffff0a 0 2px, transparent 2px 44px),
      linear-gradient(180deg, #2a1246 0%, #150a28 100%);
    transform:perspective(340px) rotateX(56deg);transform-origin:bottom center;opacity:.75}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, #ffffff08 0 1px, transparent 1px 3px);opacity:.35}
  .wrap{position:relative;z-index:1}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 16px 60px}
  header{text-align:center;margin-bottom:22px}
  h1{font-size:clamp(26px,5.4vw,48px);font-weight:900;letter-spacing:-.5px;
    background:linear-gradient(92deg,#ffd24a,#ff8ab4 42%,#7dd3fc);-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 0 40px #7dd3fc22}
  .sub{opacity:.72;font-size:clamp(13px,2.1vw,16px);margin-top:6px}
  .count{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;
    background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:5px 14px}

  /* 🔍 поиск и галерея злодеев */
  .toolbar{display:flex;gap:8px;justify-content:center;align-items:center;margin:18px 0 0;flex-wrap:wrap}
  .lupa{font-size:17px;padding:8px 14px}
  #search{width:0;overflow:hidden;transition:width .22s ease}
  #search.open{width:min(300px,62vw)}
  #search input{width:100%;font:700 14px inherit;color:#eef3ff;background:#ffffff10;
    border:1.5px solid #ffffff28;border-radius:999px;padding:9px 15px;outline:none}
  #search input::placeholder{color:#ffffff66}
  #search input:focus{border-color:#ffd24a99;box-shadow:0 0 0 3px #ffd24a22}
  .filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px}
  .f{font:800 13px inherit;color:#cfe0ff;background:#ffffff0e;border:1.5px solid #ffffff1f;
    border-radius:999px;padding:8px 15px;cursor:pointer;transition:.18s}
  .f.on{background:linear-gradient(180deg,#ffe27b,#f0a01b);color:#1a1206;border-color:#ffd24a}
  .f:hover{border-color:#ffffff44}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  /* 🕹 плитка = игровой автомат: козырёк, экран, джойстик и кнопки */
  .tile{position:relative;background:linear-gradient(180deg,#2b1a52,#1a1035 62%,#120a24);
    border:2px solid #ffffff1e;border-radius:20px 20px 12px 12px;padding:10px 10px 40px;text-align:center;
    cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;
    box-shadow:0 10px 0 #0b0718, 0 16px 34px #0009}
  .tile::before{content:'';position:absolute;left:12%;right:12%;top:7px;height:7px;border-radius:6px;
    background:linear-gradient(90deg,#ffd24a,#ff6b8a,#7dd3fc);box-shadow:0 0 14px #ff6b8a88}
  .tile::after{content:'';position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    width:68%;height:18px;border-radius:9px;background:#0d0820;
    box-shadow:inset 0 0 0 2px #ffffff14, -18px 0 0 -6px #ff4d6d, 14px 0 0 -7px #ffd24a, 30px 0 0 -7px #5ad14a}
  .tile:hover{transform:translateY(-5px);border-color:#ffd24a88;box-shadow:0 14px 0 #0b0718, 0 22px 40px #000a}
  .tile:active{transform:translateY(-1px)}
  .tile img.ic{width:84px;height:84px;border-radius:14px;display:block;margin:12px auto 9px;
    box-shadow:0 0 0 3px #0d0820, 0 0 22px #7dd3fc55}
  .tile .nm{font-weight:900;font-size:14.5px;line-height:1.25}
  .tile .tg{margin-top:7px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;
    background:#ffffff12;border:1px solid #ffffff1c;opacity:.9}
  .tag.co{background:#a7f3d022;border-color:#a7f3d055;color:#a7f3d0}
  .tag.new{background:#ffd24a22;border-color:#ffd24a66;color:#ffd24a}

  /* карточка игры */
  .back{position:fixed;inset:0;z-index:40;background:#050810e8;backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:16px}
  .back.show{display:flex}
  .card{width:min(760px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#141c33,#0c1222);
    border:1.5px solid #ffffff20;border-radius:24px;padding:18px}
  .chead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .chead img{width:68px;height:68px;border-radius:18px;box-shadow:0 8px 20px #0007}
  .chead h2{font-size:clamp(19px,3.4vw,26px);font-weight:900;line-height:1.15}
  .chead .who{opacity:.66;font-size:12.5px;margin-top:3px}
  .shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:8px 0 12px;
    scroll-snap-type:x mandatory}
  .shots img{height:min(230px,34vh);border-radius:14px;scroll-snap-align:center;
    border:1px solid #ffffff1a;flex:0 0 auto}
  .story{font-size:14.5px;line-height:1.65;background:#ffffff0a;border-left:3px solid #ffd24a;
    border-radius:0 12px 12px 0;padding:10px 13px;margin-bottom:10px;font-style:italic}
  .story b{font-style:normal;color:#ffd98a}
  .desc{font-size:14.5px;line-height:1.6;opacity:.93}
  .bad{margin-top:14px}
  .badh{font-weight:900;font-size:15px;margin-bottom:8px;color:#ff9aa8}
  .badit{display:flex;gap:11px;align-items:flex-start;background:#2a0f1a55;border:1.5px solid #ff6b8a33;
    border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .badit .e{font-size:27px;line-height:1}
  .badit .n{font-weight:900;font-size:14.5px;margin-bottom:2px}
  .badit .d{font-size:13px;line-height:1.55;opacity:.9}
  .desc b{color:#ffd98a}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{flex:1 1 160px;font:900 16px inherit;padding:14px 18px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#ffe27b,#f0a01b);color:#1a1206;box-shadow:0 5px 0 #9a6408;
    text-decoration:none;text-align:center;transition:.14s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a6408}
  .btn.gh{background:#ffffff10;color:#dbe7ff;box-shadow:0 5px 0 #ffffff12;border:1.5px solid #ffffff22}
  footer{text-align:center;opacity:.45;font-size:12px;margin-top:34px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🕹 МАРКАДА</h1>
    <div class="sub">Зал игровых автоматов Марка. Подойди к автомату — посмотри, что внутри, и играй.</div>
    <div class="count" id="count">13 игр</div>
  </header>

  <div class="toolbar">
    <button class="f lupa" id="lupa" title="Поиск игры">🔍</button>
    <div id="search"><input id="q" type="search" placeholder="Найти игру по названию…" autocomplete="off"></div>
    <button class="f" id="badBtn">😈 Злодеи</button>
  </div>
  <div class="filters">
    <button class="f on" data-f="all">Все</button>
    <button class="f" data-f="co">👥 Можно вдвоём</button>
    <button class="f" data-f="solo">🧍 На одного</button>
    <button class="f" data-f="vac">🧹 Про пылесосы</button>
    <button class="f" data-f="spooky">😱 Жуткие</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <b>МАРКАДА</b> — зал, где стоят все игры Марка.<br>
    Придумал и заказал их все — <b>Марк</b>.<br>
    Работают без интернета: открой игру и нажми «Добавить на экран Домой».
  </footer>
</div>

<div class="back" id="back">
  <div class="card" id="card"></div>
</div>

<script>
/* 🕹 МАРКАДА. Список игр: сюжет — словами Марка, где он их надиктовал. */
const ИГРЫ = [
  { id:'phantom', имя:'Тайна поместья Фантомовых', em:'👻', url:'https://maksimdodychin.github.io/mark-phantom/',
    метки:['vac','spooky','solo'], новое:false, shots:2,
    сюжет:'Семья Фантомовых давно умерла, поместье заросло, и в нём завелись мыши и призраки. Ты приходишь с пылесосом — и остаёшься один на один с тем, что живёт в этих комнатах.',
    текст:'Ловишь призраков <b>пылесосом ВИХРЬ-3000</b>. Пять миров: поместье, оранжерея, спортучасток, бассейн и Дом Призраковых. Призрак прячется в мебель — сначала выдуй его, потом засасывай. Есть улучшения, хранилище и золотой пылесос.',
    злодеи:[
      { em:'👤', имя:'МОРФ', текст:'Опасный паразит. Принимает облик ЛЮБОГО существа, кормится обидой человека и вырастает до гигантских размеров. Своё дело видит в том, чтобы ссорить людей. Призраковы держали его как главный трофей — пока он не сбежал.' },
      { em:'🕷', имя:'Мохноног', текст:'Огромный паук из подвала. Пока бодр — луч его не берёт: сначала выстрели в него предметом, а уже потом высасывай. И так три раза.' },
      { em:'🌺', имя:'Зевака', текст:'Мухоловка из оранжереи. При жизни был хорошим ботаническим учёным — теперь сам узнаёт, каково это быть растением.' },
      { em:'🎳', имя:'Спортсмен', текст:'Сосед Фантомовых, знаменитый спортсмен. Даже после смерти не бросил заниматься спортом — и ждёт тебя на боулинге.' },
    ] },
  { id:'emoplanet', имя:'Эмоциональная планета', em:'🪐', url:'https://maksimdodychin.github.io/mark-emoplanet/',
    метки:['solo'], новое:true, shots:3,
    сюжет:'Много бывает эмоций у человека. Радость, печаль, злость, страх. Все эти чувства рвутся наружу — и разносят целую планету на острова. Эта игра поможет тебе справиться со своими эмоциями.',
    текст:'Десять островов эмоций и мосты между ними. Главное правило: <b>убегаешь — страх растёт, стоишь и смотришь — уменьшается</b>. В каждом мире своя сфера, и забрать её можно, только справившись с эмоцией: на вулкане — сосчитать до десяти, в болоте — убрать грязь, в пропасти жадности — отдать вещь.',
    злодеи:[
      { em:'🕷', имя:'Страхи', текст:'Не злодеи вовсе. Паук, мышь, шприц, дырочки, теснота, собака, гроза и темнота. Они растут ровно тогда, когда от них убегаешь, и тают, когда на них смотришь.' },
      { em:'👤', имя:'Морф в Обидном лесу', текст:'Тот самый Морф из Поместья. Питается обидой и растёт. Бить бесполезно — он уменьшается, только когда вспомнишь, КАК БЫЛО НА САМОМ ДЕЛЕ.' },
    ] },
  { id:'kart', имя:'Гонки пылесосов', em:'🏁', url:'https://maksimdodychin.github.io/mark-kart/',
    метки:['vac','co'], новое:false, shots:3,
    сюжет:'Пылесосы разные, и все прекрасны. Но кто-то быстрее, а кто-то мощнее. Проверь свой пылесос и утри нос другим на гонке!',
    текст:'10 трасс по замку, монетки, ускорители, трамплины и порталы. 37 достижений, а за все сразу открывается <b>золотой пылесос</b>. Есть режим <b>вдвоём на одном экране</b> — ботов нет, только вы двое.',
    злодеи:[ { em:'🥇', имя:'Пылесосик', текст:'Золотой соперник. Гоняет на турбо-пылесосе и на золотом дроне, и обгонять его — отдельное удовольствие.' } ] },
  { id:'bitva', имя:'Битва пылесосов', em:'🧹', url:'https://maksimdodychin.github.io/mark-bitva/',

    сюжет:'Что будет, если пылесосы поссорятся и выйдут на арену? Ровно это и будет.',

    злодеи:[] },
  { id:'spider', имя:'Паучий лабиринт', em:'🕷', url:'https://maksimdodychin.github.io/mark-spider/',
    метки:['spooky','co'], новое:false, shots:2,
    сюжет:'Единственное место, куда не ступала нога насекомого, — лабиринт с пауком. Уйдёт ли жучок оттуда живым или станет обедом для паука — узнаешь ты.',
    текст:'Ты жучок-светлячок: брюшко светится ярче, когда паук близко. Собирай мух, ищи ключи к цветным дверям и беги к выходу. Есть режим <b>за паука</b> и игра <b>вдвоём</b>.',
    злодеи:[ { em:'🕷', имя:'Паук', текст:'Отрицательный персонаж Паучьего лабиринта. Очень-очень любит есть жуков. Прям очень. А на диету сесть никак не может. Глухой — ловит только глазами, так что беги и не попадайся на вид.' } ] },

    текст:'Прятаться негде — спасает только бег. Касса даёт список товаров <b>на память</b>, и ошибиться нельзя ни в одном. Люки бывают настоящие и фальшивые — отличишь только фонариком. Есть режим <b>за робота</b> и игра <b>вдвоём</b>.',
    злодеи:[ { em:'🤖', имя:'Робот-Дефект', текст:'Глухой, но зоркий: вместо рук два фонарика, снизу пылесос, на голове сирена. Вблизи втягивает в себя. Отвлечь его можно только мусором — программа уборки у него единственная уцелевшая.' } ] },
  { id:'obzhora', имя:'Пылесос-обжора', em:'🍽', url:'https://maksimdodychin.github.io/mark-obzhora/',
    метки:['vac','co'], новое:false, shots:2,

    текст:'Ешь мусор, расти и глотай тех, кто меньше. Пять комнат-убежищ, где не съедят, леденцы для мега-роста и щиты. <b>Вдвоём</b> — растёте рядом и пытаетесь съесть друг друга.',
    злодеи:[ { em:'🤖', имя:'Пылесосы побольше', текст:'Главная опасность тут — тот, кто просто крупнее тебя. Пока маленький — прячься в комнатах, потом отыграешься.' } ] },
  { id:'party', имя:'Вечеринка чемпионов', em:'🎉', url:'https://maksimdodychin.github.io/mark-party/',

    текст:'Набор весёлых мини-игр для компании. Кто ловчее, кто быстрее, кто хитрее — тот и чемпион вечеринки.',

    сюжет:'Эта история произошла давно. Ты сидел у телевизора — и вдруг пошли новости: по всему городу сбои с бытовой техникой. Ломаются светофоры, гаснут фонари, техника сходит с ума. А потом экран поймал помехи, и в них проступило лицо. Оказалось, инопланетяне взяли под контроль всю электронику на планете. И только ты можешь всех спасти.',

      { em:'💠', имя:'Сердце пришельцев', текст:'Главная цель. Голубой шар, в который по проводам идёт вся власть над техникой. Разобьёшь его — и вся техника на планете снова станет просто вещами.' },
      { em:'🍞', имя:'Гигантский тостер', текст:'Первый босс-громила. Прикрыт щитом и глушилкой, которая отрастает заново, если её сбить.' },
    ] },
  { id:'matshtorm', имя:'Математический шторм', em:'🔢', url:'https://maksimdodychin.github.io/mark-matshtorm/',
    метки:['solo'], новое:false, shots:3,
    сюжет:'Семью Единички похитили, и цифры 2–9 разбросало по мирам. Собери всю команду обратно — и дойди до логова Десятки.',
    текст:'Команда живых цифр дерётся с чёрными цифрами, а ответ ты <b>набираешь сам</b>. 100 уровней и 10 миров, и у каждого своя математика: в лесу умножают, в пещере делят, у реки дроби, в городе скобки, во льдах степени. Цифры можно объединять в одну покрупнее.',
    злодеи:[
      { em:'🔟', имя:'Десятка', текст:'Главарь чёрных цифр. Сидит в своём логове на сотом уровне и ждёт, когда ты доберёшься.' },
      { em:'🎭', имя:'Двойник', текст:'Босс 99-го уровня: копирует твою команду и повторяет твои же ходы. Победить его — значит перехитрить самого себя.' },
    ] },
  { id:'brain', имя:'Мозговые головоломки', em:'🧠', url:'https://maksimdodychin.github.io/mark-brain/',
    метки:['solo'], новое:false, shots:1,
    сюжет:'Игра, которая заставит твой мозг шевелиться.',
    текст:'Уровни-задачки на сообразительность. Смотри внимательно: ответ обычно проще, чем кажется.',
    злодеи:[] },
];

const grid = document.getElementById('grid');
const back = document.getElementById('back');
const card = document.getElementById('card');
let фильтр = 'all', поиск = '';

function метка(и) {
  const t = [];
  if (и.новое) t.push('<span class="tag new">НОВОЕ</span>');
  t.push(и.метки.includes('co') ? '<span class="tag co">👥 вдвоём</span>' : '<span class="tag">🧍 один</span>');
  return t.join('');
}
function подходит(и) {
  if (поиск) {
    const q = поиск.toLowerCase();
    if (!(и.имя.toLowerCase().includes(q) || (и.сюжет||'').toLowerCase().includes(q))) return false;
  }
  if (фильтр === 'all') return true;
  if (фильтр === 'solo') return !и.метки.includes('co');
  return и.метки.includes(фильтр);
}
function нарисовать() {
  const список = ИГРЫ.filter(подходит);
  grid.innerHTML = список.length ? список.map(и => `
    <div class="tile" data-id="${и.id}">
      <img class="ic" src="img/${и.id}-icon.png" alt="" onerror="this.style.display='none'">
      <div class="nm">${и.em} ${и.имя}</div>
      <div class="tg">${метка(и)}</div>
    </div>`).join('')
    : '<div style="grid-column:1/-1;text-align:center;opacity:.7;padding:40px 10px">🔍 Ничего не нашлось. Попробуй другое слово.</div>';
  const n = список.length;
  document.getElementById('count').textContent = n + (n === 1 ? ' игра' : n > 1 && n < 5 ? ' игры' : ' игр');
  grid.querySelectorAll('.tile').forEach(t => t.onclick = () => открыть(t.dataset.id));
}
function открыть(id) {
  const и = ИГРЫ.find(x => x.id === id); if (!и) return;
  const кадры = Array.from({ length: и.shots }, (_, k) =>
    `<img src="img/${и.id}-${k+1}.jpg" alt="" onerror="this.remove()">`).join('');
  const злодеи = (и.злодеи && и.злодеи.length) ? `
    <div class="bad"><div class="badh">😈 Злодеи этой игры</div>
    ${и.злодеи.map(з => `<div class="badit"><div class="e">${з.em}</div>
      <div><div class="n">${з.имя}</div><div class="d">${з.текст}</div></div></div>`).join('')}</div>` : '';
  card.innerHTML = `
    <div class="chead">
      <img src="img/${и.id}-icon.png" alt="" onerror="this.style.display='none'">
      <div><h2>${и.em} ${и.имя}</h2>
        <div class="who">${и.метки.includes('co') ? '👥 можно играть вдвоём' : '🧍 игра на одного'}</div></div>
    </div>
    <div class="shots">${кадры}</div>
    <div class="story">📖 <b>Сюжет.</b> ${и.сюжет}</div>
    <div class="desc">🎮 ${и.текст}</div>
    ${злодеи}
    <div class="row">
      <a class="btn" href="${и.url}" target="_blank" rel="noopener">▶️ ИГРАТЬ</a>
      <button class="btn gh" id="cancel">✖️ Отмена</button>
    </div>`;
  back.classList.add('show'); card.scrollTop = 0;
  document.getElementById('cancel').onclick = закрыть;
}
/* 😈 ГАЛЕРЕЯ ЗЛОДЕЕВ — все злодеи всех игр в одном месте (заказ Марка) */
function галерея() {
  const все = [];
  ИГРЫ.forEach(и => (и.злодеи||[]).forEach(з => все.push({ ...з, игра:и.имя, ид:и.id })));
  card.innerHTML = `
    <div class="chead"><div style="font-size:52px">😈</div>
      <div><h2>Галерея злодеев</h2><div class="who">${все.length} штук из всех игр</div></div></div>
    <div class="bad">${все.map(з => `<div class="badit">
      <div class="e">${з.em}</div>
      <div><div class="n">${з.имя} <span style="opacity:.5;font-weight:700;font-size:12px">· ${з.игра}</span></div>
      <div class="d">${з.текст}</div></div></div>`).join('')}</div>
    <div class="row"><button class="btn gh" id="cancel">✖️ Закрыть</button></div>`;
  back.classList.add('show'); card.scrollTop = 0;
  document.getElementById('cancel').onclick = закрыть;
}
function закрыть() { back.classList.remove('show'); }
back.onclick = e => { if (e.target === back) закрыть(); };
addEventListener('keydown', e => { if (e.key === 'Escape') закрыть(); });
document.querySelectorAll('.f').forEach(b => b.onclick = () => {
  document.querySelectorAll('.f').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); фильтр = b.dataset.f; нарисовать();
});
/* 🔍 ПОИСК по названию (заказ Марка) */
const поле = document.getElementById('q');
document.getElementById('lupa').onclick = () => {
  document.getElementById('search').classList.toggle('open');
  if (document.getElementById('search').classList.contains('open')) поле.focus();
  else { поле.value = ''; поиск = ''; нарисовать(); }
};
поле.oninput = () => { поиск = поле.value.trim(); нарисовать(); };
поле.onkeydown = e => { if (e.key === 'Escape') { поле.value = ''; поиск = ''; нарисовать(); } };
document.getElementById('badBtn').onclick = галерея;
нарисовать();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
